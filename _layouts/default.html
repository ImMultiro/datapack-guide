<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    {% include navbar.html %}
    
    <div id="main">
      <h1 id="title">{{ page.title }}</h1>

      {% if site.wip %}
        <blockquote id="wip-note">This project is a <strong>Work in Progress</strong>. Proceed at your own risk.</blockquote>
      {% endif %}

      <p id="description">
        {% if page.description %} {{ page.description }}
        {% else %} {{ site.description }}
        {% endif %}
      </p>
      
      {{ content }}
    </div>

  </body>
</html>
